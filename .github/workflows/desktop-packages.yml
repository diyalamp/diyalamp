name: Package macOS editor
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and test installers without staging a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            fx_platform: mac-aarch64
          - os: macos-15-intel
            arch: x86_64
            fx_platform: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - id: version
        run: echo "version=$(sh desktop/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Build unsigned validation installers
        if: ${{ inputs.validate_only }}
        run: sh desktop/package-macos.sh
      - name: Sign and notarize release installers
        if: ${{ !inputs.validate_only }}
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_DEVELOPER_ID_P12:?Configure APPLE_DEVELOPER_ID_P12 to build public installers}"
          : "${APPLE_DEVELOPER_ID_PASSWORD:?Configure APPLE_DEVELOPER_ID_PASSWORD}"
          : "${APPLE_NOTARY_KEY:?Configure APPLE_NOTARY_KEY}"
          : "${APPLE_NOTARY_KEY_ID:?Configure APPLE_NOTARY_KEY_ID}"
          : "${APPLE_NOTARY_ISSUER:?Configure APPLE_NOTARY_ISSUER}"
          original_umask=$(umask)
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/diyalamp-signing.XXXXXX")
          keychain="$signing_dir/release.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$signing_dir"' EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 -D > "$signing_dir/developer-id.p12"
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$signing_dir/notary-key.p8"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$signing_dir/developer-id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p')
          test -n "$identity"
          test "$(printf '%s\n' "$identity" | wc -l | tr -d ' ')" -eq 1
          xcrun notarytool store-credentials diyalamp-release --keychain "$keychain" \
            --key "$signing_dir/notary-key.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER"
          unset APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER
          rm -f "$signing_dir/developer-id.p12" "$signing_dir/notary-key.p8"
          umask "$original_umask"
          DIYALAMP_MAC_SIGNING_IDENTITY="$identity" DIYALAMP_MAC_SIGNING_KEYCHAIN="$keychain" \
            DIYALAMP_NOTARY_PROFILE=diyalamp-release sh desktop/package-macos.sh
      - name: Verify the mounted installer and bundled runtime
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          FX_PLATFORM: ${{ matrix.fx_platform }}
          VERIFY_NOTARIZATION: ${{ !inputs.validate_only }}
        run: |
          name="diyalamp-$VERSION-macos-$ARCH.dmg"
          (cd build/release && shasum -a 256 -c "$name.sha256")
          hdiutil verify "build/release/$name"
          mount=$(mktemp -d)
          installed=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "build/release/$name"
          trap 'hdiutil detach "$mount" >/dev/null; rm -rf "$installed"' EXIT
          app="$installed/diyalamp.app"
          ditto "$mount/diyalamp.app" "$app"
          payload="$app/Contents/app"
          java="$app/Contents/runtime/Contents/Home/bin/java"
          codesign --verify --deep --strict "$app"
          if [ "$VERIFY_NOTARIZATION" = true ]; then
            codesign --verify --strict "build/release/$name"
            xcrun stapler validate "build/release/$name"
            xcrun stapler validate "$app"
            syspolicy_check distribution "$app"
          fi
          test "$(lipo -archs "$app/Contents/MacOS/diyalamp")" = "$ARCH"
          test "$(lipo -archs "$java")" = "$ARCH"
          test -z "$(find "$payload" -type f \( -name 'flatlaf-*.jar' -o -name 'jsvg-*.jar' \) -print)"
          for suite in fx.FxWritingPaneTests update.UpdateTests; do
            "$java" --module-path "$payload/fx-deps/$FX_PLATFORM" --add-modules javafx.controls \
              --enable-native-access=javafx.graphics,ALL-UNNAMED -Djava.awt.headless=true \
              -Dglass.platform=Headless -Dprism.order=sw \
              -cp "$payload/diyalamp.jar:$PWD/build/test-classes" "com.diyalamp.desktop.$suite"
          done
          printf '%s %s bytes\n' "$name" "$(wc -c < "build/release/$name" | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.validate_only && 'diyalamp-validation' || 'diyalamp' }}-macos-${{ matrix.arch }}
          path: desktop/build/release/*.dmg*
          if-no-files-found: error
  stage-release:
    needs: package
    if: ${{ github.ref_name == 'main' && !inputs.validate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          pattern: diyalamp-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify installer checksums
        working-directory: release-artifacts
        run: shasum -a 256 -c *.sha256
      - name: Stage verified installers in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sh desktop/version.sh)
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/diyalamp-release-draft.txt 2>/dev/null; then
            test "$(cat /tmp/diyalamp-release-draft.txt)" = true
            gh release upload "$tag" release-artifacts/*.dmg release-artifacts/*.sha256 --clobber
            gh release edit "$tag" --notes-file desktop/RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "$tag" release-artifacts/*.dmg release-artifacts/*.sha256 --draft --target "$GITHUB_SHA" --title "diyalamp $version" --notes-file desktop/RELEASE_NOTES.md
          fi
