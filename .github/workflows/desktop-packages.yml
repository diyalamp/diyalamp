name: Package native macOS editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Build and verify on Apple silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare parser and run native tests
        run: |
          test "$(uname -m)" = arm64
          cmark="$RUNNER_TEMP/diyalamp-cmark"
          sh native/macos/prepare-cmark.sh "$cmark"
          sh native/macos/test.sh "$cmark"
      - id: build
        name: Build and mount-verify the universal installer
        run: |
          set -o pipefail
          cmark="$RUNNER_TEMP/diyalamp-cmark"
          log="$RUNNER_TEMP/diyalamp-build.log"
          sh native/macos/build.sh "$PWD/desktop/src/main/resources" "$cmark" | tee "$log"
          directory=$(sed -n 's/^Build directory: //p' "$log")
          test -n "$directory"
          sh native/macos/verify.sh "$directory/DiyaLamp-macOS.dmg" "$cmark"/cmark-gfm-*/COPYING
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: diyalamp-macos-universal
          path: |
            ${{ steps.build.outputs.directory }}/DiyaLamp-macOS.dmg
            ${{ steps.build.outputs.directory }}/DiyaLamp-macOS.dmg.sha256
          if-no-files-found: error
  verify-intel:
    name: Verify the same installer on Intel
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: diyalamp-macos-universal
          path: release-artifacts
      - name: Run native tests and mount-verify the installer
        run: |
          test "$(uname -m)" = x86_64
          cmark="$RUNNER_TEMP/diyalamp-cmark"
          sh native/macos/prepare-cmark.sh "$cmark"
          sh native/macos/test.sh "$cmark"
          sh native/macos/verify.sh release-artifacts/DiyaLamp-macOS.dmg "$cmark"/cmark-gfm-*/COPYING
