name: Package macOS editor
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and test installers without staging a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            fx_platform: mac-aarch64
          - os: macos-15-intel
            arch: x86_64
            fx_platform: mac
    runs-on: ${{ matrix.os }}
    # Developer ID and notarization secrets live in this environment. Without
    # them the job builds ad hoc signed installers, as before.
    environment: macos-signing
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - id: version
        run: echo "version=$(sh desktop/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Import the Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo 'No signing secrets; building ad hoc signed installers.'
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/diyalamp-signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # runner keychain paths contain no spaces
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Runner images may lack Apple's Developer ID intermediates; without
          # them the identity is untrusted and codesign reports "no identity found".
          while read -r checksum name; do
            curl --fail --silent --show-error --location --proto '=https' -o "$RUNNER_TEMP/$name.cer" "https://www.apple.com/certificateauthority/$name.cer"
            printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/$name.cer" | shasum -a 256 -c -
            security import "$RUNNER_TEMP/$name.cer" -k "$keychain" || true
          done <<'EOF'
          f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a DeveloperIDG2CA
          7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f DeveloperIDCA
          EOF
          echo 'Code signing identities in the imported certificate:'
          security find-identity -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "\"$SIGN_IDENTITY\""; then
            echo '::error::MACOS_SIGN_IDENTITY does not name a valid identity in MACOS_CERTIFICATE_P12. Compare it with the list above; a name equal to the secret appears as ***.'
            exit 1
          fi
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: sh desktop/package-macos.sh
        env:
          DIYALAMP_SIGN_IDENTITY: ${{ steps.signing.outputs.signed == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          DIYALAMP_SIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          DIYALAMP_NOTARY_KEY: ${{ steps.signing.outputs.signed == 'true' && format('{0}/notary-key.p8', runner.temp) || '' }}
          DIYALAMP_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          DIYALAMP_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
      - name: Verify the mounted installer and bundled runtime
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          FX_PLATFORM: ${{ matrix.fx_platform }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          name="diyalamp-$VERSION-macos-$ARCH.dmg"
          (cd build/release && shasum -a 256 -c "$name.sha256")
          hdiutil verify "build/release/$name"
          mount=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "build/release/$name"
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$mount/diyalamp.app"
          payload="$app/Contents/app"
          java="$app/Contents/runtime/Contents/Home/bin/java"
          codesign --verify --deep --strict "$app"
          if [ "$SIGNED" = true ]; then
            codesign -dvv "$app" 2>&1 | grep '^Authority=Developer ID Application:'
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "build/release/$name"
            spctl --assess --type open --context context:primary-signature -vv "build/release/$name"
          fi
          test "$(lipo -archs "$app/Contents/MacOS/diyalamp")" = "$ARCH"
          test "$(lipo -archs "$java")" = "$ARCH"
          test -z "$(find "$payload" -type f \( -name 'flatlaf-*.jar' -o -name 'jsvg-*.jar' \) -print)"
          for suite in fx.FxWritingPaneTests fx.FxFilePreviewTests update.UpdateTests; do
            "$java" --module-path "$payload/fx-deps/$FX_PLATFORM" --add-modules javafx.controls \
              --enable-native-access=javafx.graphics,ALL-UNNAMED -Djava.awt.headless=true \
              -Dglass.platform=Headless -Dprism.order=sw \
              -cp "$payload/diyalamp.jar:$PWD/build/test-classes" "com.diyalamp.desktop.$suite"
          done
          printf '%s %s bytes\n' "$name" "$(wc -c < "build/release/$name" | tr -d ' ')"
      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.validate_only && 'diyalamp-validation' || 'diyalamp' }}-macos-${{ matrix.arch }}
          path: desktop/build/release/*.dmg*
          if-no-files-found: error
  stage-release:
    needs: package
    if: ${{ !inputs.validate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          pattern: diyalamp-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify installer checksums
        working-directory: release-artifacts
        run: shasum -a 256 -c *.sha256
      - name: Stage verified installers in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sh desktop/version.sh)
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/diyalamp-release-draft.txt 2>/dev/null; then
            test "$(cat /tmp/diyalamp-release-draft.txt)" = true
            gh release upload "$tag" release-artifacts/*.dmg release-artifacts/*.sha256 --clobber
            gh release edit "$tag" --notes-file desktop/RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            gh release create "$tag" release-artifacts/*.dmg release-artifacts/*.sha256 --draft --target "$GITHUB_SHA" --title "diyalamp $version" --notes-file desktop/RELEASE_NOTES.md
          fi
