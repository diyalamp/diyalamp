name: Package macOS editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - run: sh desktop/package-macos.sh
      - run: hdiutil verify desktop/build/release/diyalamp-1.0.0-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: diyalamp-macos-${{ matrix.arch }}
          path: desktop/build/release/*.dmg*
          if-no-files-found: error
  stage-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          pattern: diyalamp-macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify installer checksums
        working-directory: release-artifacts
        run: shasum -a 256 -c *.sha256
      - name: Stage verified installers in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --json isDraft --jq .isDraft > /tmp/diyalamp-release-draft.txt 2>/dev/null; then
            test "$(cat /tmp/diyalamp-release-draft.txt)" = true
            gh release upload v1.0.0 release-artifacts/*.dmg release-artifacts/*.sha256 --clobber
            gh release edit v1.0.0 --notes-file desktop/RELEASE_NOTES.md --target "$GITHUB_SHA"
          else
            gh release create v1.0.0 release-artifacts/*.dmg release-artifacts/*.sha256 --draft --target "$GITHUB_SHA" --title 'diyalamp 1.0.0' --notes-file desktop/RELEASE_NOTES.md
          fi
