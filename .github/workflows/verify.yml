name: Verify native macOS editor
on:
  push:
    paths: ['native/macos/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['native/macos/**', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run native tests
        run: |
          cmark="$RUNNER_TEMP/diyalamp-cmark"
          sh native/macos/prepare-cmark.sh "$cmark"
          sh native/macos/test.sh "$cmark"
